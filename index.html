<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MM3 Seed RPG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b10'/%3E%3Cpath d='M16 4l10 6v8c0 5-4 8-10 10C10 26 6 23 6 18v-8z' fill='none' stroke='%23d8b45a' stroke-width='2'/%3E%3Cpath d='M16 10v12M11 14h10' stroke='%23d8b45a' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b10; color: #d8d2c0; font-family: system-ui, sans-serif; }
      /* the message of the first seconds: the game's modules and models are still on their way, nothing else can be drawn yet */
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b0b10; color: #d8b45a; font-family: Georgia, serif; text-align: center; cursor: none; }
      #boot .text { font-size: clamp(20px, 3.4vh, 34px); letter-spacing: 0.06em; }
      #boot .bar { width: min(340px, 60vw); height: 8px; border: 1px solid #5a4020; border-radius: 5px; background: #16120c; overflow: hidden; }
      #boot .fill { height: 100%; width: 30%; background: #d8b45a; animation: boot-slide 1.3s ease-in-out infinite; }
      /* once the share is known the bar fills up instead of sliding */
      #boot.known .fill { animation: none; transition: width 0.2s; }
      #boot .pct { min-height: 1.4em; font-size: clamp(16px, 2.6vh, 26px); }
      @keyframes boot-slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="text">Game is loading…</div><div class="bar"><div class="fill"></div></div><div class="pct"></div></div>
    <script>
      // `src/game/boot.ts` drives this while the game starts; it stays a plain script so that it runs before the modules have arrived
      window.__boot = (function () {
        var el = document.getElementById("boot");
        var fill = el.querySelector(".fill");
        var pct = el.querySelector(".pct");
        return {
          set: function (fraction) {
            var p = Math.max(0, Math.min(100, Math.floor(fraction * 100)));
            el.classList.add("known");
            fill.style.width = p + "%";
            pct.textContent = p + "%";
          },
          done: function () {
            el.remove();
          },
        };
      })();
    </script>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
